<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Julio Contreras — Data Platform Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9248"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Diagonal stripes, matching avatar style -->
  <g stroke="#2C2C2C" stroke-width="16" opacity="0.9">
    <line x1="-20" y1="60" x2="60" y2="-20"/>
    <line x1="20" y1="120" x2="120" y2="20"/>
  </g>
  <g stroke="#FF7A1A" stroke-width="6" opacity="0.85">
    <line x1="-20" y1="30" x2="30" y2="-20"/>
  </g>

  <g stroke="#2C2C2C" stroke-width="16" opacity="0.9">
    <line x1="1140" y1="320" x2="1240" y2="220"/>
    <line x1="1080" y1="280" x2="1180" y2="180"/>
  </g>
  <g stroke="#FF7A1A" stroke-width="6" opacity="0.85">
    <line x1="1170" y1="320" x2="1220" y2="270"/>
  </g>

  <!-- Left vertical accent -->
  <rect x="0" y="70" width="4" height="150" fill="url(#accentLine)"/>

  <!-- ===== Right side: circular avatar-style badge + mini stack graph ===== -->
  <g transform="translate(880, 55)">
    <!-- outer ring, like the avatar frame -->
    <circle cx="95" cy="95" r="92" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="3"/>
    <circle cx="95" cy="95" r="92" fill="none" stroke="#FF7A1A" stroke-width="3" opacity="0.9"/>

    <!-- inner content: stacked tool marks arranged in a ring -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="12.5" fill="#E8E4DC" text-anchor="middle">
      <circle cx="95" cy="95" r="5" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
      <text x="95" y="40">Python</text>
      <text x="95" y="160">GCP</text>
      <text x="35" y="100">BQ</text>
      <text x="155" y="100">FastAPI</text>
      <text x="55" y="58">Postgre</text>
      <text x="140" y="140">Pub/Sub</text>

      <!-- connecting spokes -->
      <g stroke="#4A4A4A" stroke-width="1.2" opacity="0.8">
        <line x1="95" y1="95" x2="95" y2="48"/>
        <line x1="95" y1="95" x2="95" y2="150"/>
        <line x1="95" y1="95" x2="50" y2="97"/>
        <line x1="95" y1="95" x2="140" y2="97"/>
        <line x1="95" y1="95" x2="63" y2="65"/>
        <line x1="95" y1="95" x2="128" y2="130"/>
      </g>
    </g>
  </g>

  <!-- ===== Left side: identity ===== -->
  <text x="80" y="122"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="62" font-weight="700"
        fill="#F5F0E8" letter-spacing="-1">
    Julio Contreras
  </text>

  <rect x="82" y="144" width="120" height="4" fill="#FF7A1A" rx="2"/>

  <text x="82" y="184"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="24" font-weight="400"
        fill="#B7B7B7" letter-spacing="0.3">
    Data Platform Engineer
  </text>

  <text x="82" y="230"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14.5"
        fill="#8A8A8A" letter-spacing="0.4">
    python · fastapi · gcp · bigquery · postgresql · pub/sub
  </text>
</svg>
